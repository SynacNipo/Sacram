name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'   # 12:00 AM UTC daily
  workflow_dispatch:

# Automatic nightly pre-release. Builds the APK every day at midnight and
# publishes it as a pre-release named "vX.XX - Nightly Build" (tag vX.XX-nightly).
# Use [Trigger] on a commit only when you want a stable, non-nightly release.

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x src/gradle-stuff/gradlew

      - name: Compute next free release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --json tagName -q '.[].tagName' | grep -v nightly | sort -V | tail -1)
          if [ -z "$latest" ]; then
            latest="v0.0"
          fi
          major=$(echo "$latest" | sed 's/v\([0-9]*\)\..*/\1/')
          minor=$(echo "$latest" | sed 's/v[0-9]*\.\([0-9]*\).*/\1/')
          next="v$major.$((minor + 1))"
          while gh release view "${next}-nightly" >/dev/null 2>&1; do
            minor=$((minor + 1))
            next="v$major.$minor"
          done
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=${next}-nightly" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: cd src/gradle-stuff && ./gradlew assembleDebug --no-daemon -PappVersion="${{ steps.tag.outputs.version }}"

      - name: Rename APK to sacram.apk
        run: cp src/MobileApp-src/build/outputs/apk/debug/app-debug.apk src/MobileApp-src/build/outputs/apk/debug/sacram.apk

      - name: Publish nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            src/MobileApp-src/build/outputs/apk/debug/sacram.apk \
            --title "${{ steps.tag.outputs.version }} - Nightly Build" \
            --notes "Automatic nightly build from commit ${{ github.sha }}" \
            --prerelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sacram-nightly-apk
          path: src/MobileApp-src/build/outputs/apk/debug/sacram.apk
          retention-days: 7
