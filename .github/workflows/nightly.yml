name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'   # 12:00 AM UTC daily
  workflow_dispatch:

# Automatic nightly pre-release. Builds the APK every day at midnight and
# publishes it as a pre-release named "vX.XX - Nightly Build" (tag vX.XX-nightly).
# Use [Trigger] on a commit only when you want a stable, non-nightly release.

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x src/gradle-stuff/gradlew

      - name: Compute next free release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nightly tracks the CURRENT stable version as its base (so stable
          # v1.59 -> nightly v1.59-nightly), NOT stable+1. Previously the nightly
          # incremented past stable, so the same commit shipped as both v1.53
          # (stable) and v1.54-nightly - a permanent off-by-one. Only bump the
          # minor if a nightly for that exact base already exists (re-run guard).
          latest=$(gh release list --json tagName -q '.[].tagName' | grep -v nightly | sort -V | tail -1)
          if [ -z "$latest" ]; then
            latest="v0.0"
          fi
          major=$(echo "$latest" | sed 's/v\([0-9]*\)\..*/\1/')
          minor=$(echo "$latest" | sed 's/v[0-9]*\.\([0-9]*\).*/\1/')
          base="v$major.$minor"
          next="${base}-nightly"
          while gh release view "$next" >/dev/null 2>&1; do
            minor=$((minor + 1))
            base="v$major.$minor"
            next="${base}-nightly"
          done
          echo "version=$base" >> "$GITHUB_OUTPUT"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          SACRAM_KEYSTORE_BASE64: ${{ secrets.SACRAM_KEYSTORE_BASE64 }}
          SACRAM_KEY_ALIAS: ${{ secrets.SACRAM_KEY_ALIAS }}
          SACRAM_STORE_PASSWORD: ${{ secrets.SACRAM_STORE_PASSWORD }}
          SACRAM_KEY_PASSWORD: ${{ secrets.SACRAM_KEY_PASSWORD }}
        run: cd src/gradle-stuff && ./gradlew assembleRelease --no-daemon -PappVersion="${{ steps.tag.outputs.version }}"

      - name: Rename APK to sacram.apk
        run: cp src/MobileApp-src/build/outputs/apk/release/app-release.apk src/MobileApp-src/build/outputs/apk/release/sacram.apk

      - name: Compute SHA256 checksum
        id: sha
        run: |
          cd src/MobileApp-src/build/outputs/apk/release
          HASH=$(sha256sum sacram.apk | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "$HASH  sacram.apk" > sacram.apk.sha256

      - name: Publish nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.sha.outputs.hash }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            src/MobileApp-src/build/outputs/apk/release/sacram.apk \
            src/MobileApp-src/build/outputs/apk/release/sacram.apk.sha256 \
            --title "${{ steps.tag.outputs.version }} - Nightly Build" \
            --notes "Automatic nightly build from commit ${{ github.sha }} | SHA256: $SHA256" \
            --prerelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sacram-nightly-apk
          path: src/MobileApp-src/build/outputs/apk/release/sacram.apk
          retention-days: 7
