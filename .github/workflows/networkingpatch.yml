name: Networking Patch Build

on:
  push:
    branches: [networkingpatch]
  workflow_dispatch:

# High-risk networking rewrites land here, NOT on main.
# Every push to networkingpatch builds a test APK and publishes it as a
# pre-release tagged vX.XX-networkingpatch so beta users can install it
# without touching stable. Stable releases still only come from main + [Trigger].

concurrency:
  group: networkingpatch-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: networkingpatch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x src/gradle-stuff/gradlew

      - name: Run unit tests
        run: cd src/gradle-stuff && ./gradlew test --no-daemon

      - name: Compute networking-patch tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Base on current stable (non-patch) so the patch
          # pre-release is traceable to what it was forked from.
          latest=$(gh release list --json tagName -q '.[].tagName' | grep -v networkingpatch | sort -V | tail -1)
          if [ -z "$latest" ]; then
            latest="v0.0"
          fi
          major=$(echo "$latest" | sed 's/v\([0-9]*\)\..*/\1/')
          minor=$(echo "$latest" | sed 's/v[0-9]*\.\([0-9]*\).*/\1/')
          base="v$major.$minor"
          next="${base}-networkingpatch"
          while gh release view "$next" >/dev/null 2>&1; do
            minor=$((minor + 1))
            base="v$major.$minor"
            next="${base}-networkingpatch"
          done
          echo "version=$base" >> "$GITHUB_OUTPUT"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "Patch tag: $next (base $base)"

      - name: Build release APK
        env:
          SACRAM_KEYSTORE_BASE64: ${{ secrets.SACRAM_KEYSTORE_BASE64 }}
          SACRAM_KEY_ALIAS: ${{ secrets.SACRAM_KEY_ALIAS }}
          SACRAM_STORE_PASSWORD: ${{ secrets.SACRAM_STORE_PASSWORD }}
          SACRAM_KEY_PASSWORD: ${{ secrets.SACRAM_KEY_PASSWORD }}
        run: cd src/gradle-stuff && ./gradlew assembleRelease --no-daemon -PappVersion="${{ steps.tag.outputs.version }}-patch"

      - name: Rename APK to sacram.apk
        run: cp src/MobileApp-src/build/outputs/apk/release/app-release.apk src/MobileApp-src/build/outputs/apk/release/sacram.apk

      - name: Compute SHA256 checksum
        id: sha
        run: |
          cd src/MobileApp-src/build/outputs/apk/release
          HASH=$(sha256sum sacram.apk | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "$HASH  sacram.apk" > sacram.apk.sha256

      - name: Publish networking-patch pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.sha.outputs.hash }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            src/MobileApp-src/build/outputs/apk/release/sacram.apk \
            src/MobileApp-src/build/outputs/apk/release/sacram.apk.sha256 \
            --title "${{ steps.tag.outputs.version }} - Networking Patch (beta)" \
            --notes "Experimental networking rewrite from branch networkingpatch @ commit ${{ github.sha }} | Base stable ${{ steps.tag.outputs.version }} | SHA256: $SHA256 | For beta testers only - stable users stay on main releases." \
            --prerelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sacram-networkingpatch-apk
          path: src/MobileApp-src/build/outputs/apk/release/sacram.apk
          retention-days: 14
