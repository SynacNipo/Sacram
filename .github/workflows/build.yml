name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Build on GitHub runners so your machine is never loaded.
concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run-build: ${{ steps.check.outputs.run-build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check for [Trigger] in latest commit message
        id: check
        run: |
          msg=$(git log -1 --format=%s)
          if echo "$msg" | grep -q "\[Trigger\]"; then
            echo "run-build=true" >> "$GITHUB_OUTPUT"
            echo "Commit contains [Trigger] -> building"
          else
            echo "run-build=false" >> "$GITHUB_OUTPUT"
            echo "No [Trigger] in commit: $msg -> skipping build"
          fi

  build:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run-build == 'true'
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x src/gradle-stuff/gradlew

      - name: Compute next free release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --json tagName -q '.[].tagName' | grep -v nightly | sort -V | tail -1)
          if [ -z "$latest" ]; then
            latest="v0.0"
          fi
          major=$(echo "$latest" | sed 's/v\([0-9]*\)\..*/\1/')
          minor=$(echo "$latest" | sed 's/v[0-9]*\.\([0-9]*\).*/\1/')
          next="v$major.$((minor + 1))"
          while gh release view "$next" >/dev/null 2>&1; do
            minor=$((minor + 1))
            next="v$major.$minor"
          done
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: cd src/gradle-stuff && ./gradlew assembleDebug --no-daemon -PappVersion="${{ steps.tag.outputs.tag }}"

      - name: Rename APK to sacram.apk
        run: cp src/MobileApp-src/build/outputs/apk/debug/app-debug.apk src/MobileApp-src/build/outputs/apk/debug/sacram.apk

      - name: Publish release (auto-incremented tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            src/MobileApp-src/build/outputs/apk/debug/sacram.apk \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "Automatic build from commit ${{ github.sha }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sacram-udp-bridge-apk
          path: src/MobileApp-src/build/outputs/apk/debug/sacram.apk
          retention-days: 14
