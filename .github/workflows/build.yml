name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Build on GitHub runners so your machine is never loaded.
concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Compute next release tag
        id: tag
        run: |
          latest=$(gh release list --json tagName -q '.[].tagName' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            tag="v1.0"
          else
            major=$(echo "$latest" | sed 's/v\([0-9]*\)\..*/\1/')
            minor=$(echo "$latest" | sed 's/v[0-9]*\.\([0-9]*\).*/\1/')
            minor=$((minor + 1))
            tag="v$major.$minor"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish release (auto-incremented tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "Automatic build from commit ${{ github.sha }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sacram-udp-bridge-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
